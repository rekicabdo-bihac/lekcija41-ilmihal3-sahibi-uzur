file", "Samo sjedenje u džamiji"], "a": "Druga radnja koja inače kvari abdest"}, {"q": "Može li sahibi-uzur jednim abdestom klanjati više namaza unutar istog namaskog vremena?", "opts": ["Da, dok traje to namasko vrijeme i ne nastupi drugi kvaritelj abdesta", "Ne, za svaki namaz mora uzeti novi abdest", "Da, bez vremenskog ograničenja", "Ne, može klanjati samo jedan rekat"], "a": "Da, dok traje to namasko vrijeme i ne nastupi drugi kvaritelj abdesta"}];const CARD_QA=[{"q": "Ko se smatra sahibi-uzurom?", "a": "Osoba s trajnom smetnjom koja onemogućava čuvanje abdesta", "opts": ["Osoba s trajnom smetnjom koja onemogućava čuvanje abdesta", "Svaka osoba koja je umorna", "Osoba koja je jednom zaboravila abdest", "Svaka osoba koja putuje"]}, {"q": "Koji je primjer smetnje sahibi-uzura?", "a": "Nekontrolirano oticanje krvi", "opts": ["Nekontrolirano oticanje krvi", "Povremena glavobolja", "Umor poslije posla", "Kratkotrajna žeđ"]}, {"q": "Koliko dugo smetnja mora trajati da bi se stekao status sahibi-uzura?", "a": "Najmanje jedno cijelo namasko vrijeme bez dovoljno prekida za abdest i namaz", "opts": ["Najmanje jedno cijelo namasko vrijeme bez dovoljno prekida za abdest i namaz", "Samo nekoliko minuta", "Najmanje tri puna dana", "Tačno sedam dana"]}, {"q": "Šta sahibi-uzur uzima za svako namasko vrijeme?", "a": "Novi abdest", "opts": ["Novi abdest", "Novi gusul", "Tejemum bez obzira na vodu", "Samo nijjet bez abdesta"]}, {"q": "Šta može klanjati u jednom namaskom vremenu s tim abdestom?", "a": "Farz, propuštene namaze i nafile", "opts": ["Farz, propuštene namaze i nafile", "Samo jedan farz", "Samo nafile", "Samo propušteni namaz"]}, {"q": "Kada je bolje uzeti abdest ako se očekuje prestanak smetnje?", "a": "Pred kraj namaskog vremena", "opts": ["Pred kraj namaskog vremena", "Isključivo na početku vremena", "Nakon isteka vremena", "Tek narednog dana"]}, {"q": "Kada se status sahibi-uzura zadržava?", "a": "Ako se smetnja pojavi makar jednom u svakom namaskom vremenu", "opts": ["Ako se smetnja pojavi makar jednom u svakom namaskom vremenu", "Samo ako se smetnja javlja svake minute", "Ako se smetnja ne javi cijeli dan", "Samo ako osoba ne klanja"]}, {"q": "Kada osoba prestaje biti sahibi-uzur?", "a": "Kad smetnja izostane cijelo namasko vrijeme", "opts": ["Kad smetnja izostane cijelo namasko vrijeme", "Kad jednom uzme abdest", "Kad klanja jedan farz", "Kad se smetnja pojavi jednom"]}, {"q": "Šta, osim isteka namaskog vremena, kvari abdest sahibi-uzura?", "a": "Druga radnja koja inače kvari abdest", "opts": ["Druga radnja koja inače kvari abdest", "Samo učenje Kur’ana", "Samo klanjanje nafile", "Samo sjedenje u džamiji"]}, {"q": "Može li sahibi-uzur jednim abdestom klanjati više namaza unutar istog namaskog vremena?", "a": "Da, dok traje to namasko vrijeme i ne nastupi drugi kvaritelj abdesta", "opts": ["Da, dok traje to namasko vrijeme i ne nastupi drugi kvaritelj abdesta", "Ne, za svaki namaz mora uzeti novi abdest", "Da, bez vremenskog ograničenja", "Ne, može klanjati samo jedan rekat"]}];const LESSON=[["Ko je sahibi-uzur?", "Sahibi-uzur je osoba koja zbog neprekidne smetnje ne može sačuvati abdest tokom najmanje jednog cijelog namaskog vremena. Primjeri su nekontrolirano oticanje krvi ili urina te nekontrolirano puštanje vjetrova."], ["Stjecanje statusa", "Smetnja traje najmanje jedno cijelo namasko vrijeme tako da nema dovoljno prekida za uzimanje abdesta i obavljanje namaza."], ["Abdest i namaz", "Za svako namasko vrijeme sahibi-uzur uzima abdest. Tokom tog vremena može klanjati farz, propuštene namaze i nafile te učiti Kur’an."], ["Kada uzeti abdest?", "Ako se očekuje da će smetnja prestati, osoba će sačekati do pred kraj namaskog vremena. Ako se ne očekuje prestanak, može klanjati na početku vremena."], ["Trajanje statusa", "Status traje ako se smetnja pojavi makar jednom u svakom narednom namaskom vremenu. Prestaje ako smetnja izostane tokom cijelog jednog namaskog vremena."], ["Šta kvari abdest?", "Abdest sahibi-uzura prestaje važiti istekom namaskog vremena ili ako nastupi neki drugi uobičajeni kvaritelj abdesta."]];let sound=true,audioCtx,cardIndex=0,qi=0,score=0,locked=false,matchPick=null,matchDone=new Set(),memOpen=[],memDone=new Set(),memLocked=false;function beep(ok){if(!sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=ok?740:220;g.gain.value=.08;o.start();o.stop(audioCtx.currentTime+.13)}catch(e){}}function toggleSound(){sound=!sound;document.getElementById('sound').textContent=sound?'🔊 Zvuk':'🔇 Bez zvuka'}function show(id){for(let x of ['menu','lesson','cards','quiz','match','memory'])document.getElementById(x).classList.toggle('hide',x!==id);window.scrollTo(0,0)}document.getElementById('lesson').innerHTML='<h2>📖 Sahibi-uzur</h2>'+LESSON.map(([t,v])=>'<article class="card"><h3>'+t+'</h3><p>'+v+'</p></article>').join('');function startCards(){cardIndex=0;show('cards');drawCard()}function drawCard(){let q=CARD_QA[cardIndex];document.getElementById('cardNum').textContent='Kartica '+(cardIndex+1)+' / '+CARD_QA.length;document.getElementById('cardQ').textContent=q.q;document.getElementById('cardA').textContent=q.a;document.getElementById('cardA').classList.add('hide')}function revealCard(){document.getElementById('cardA').classList.remove('hide');beep(true)}function nextCard(){cardIndex=(cardIndex+1)%CARD_QA.length;drawCard()}function startQuiz(){qi=0;score=0;show('quiz');drawQuiz()}function drawQuiz(){locked=false;let q=QA[qi];document.getElementById('quizNum').textContent='Pitanje '+(qi+1)+' / '+QA.length;document.getElementById('quizQ').textContent=q.q;document.getElementById('quizFeedback').textContent='';document.getElementById('quizScore').textContent='Bodovi: '+score;let opts=q.opts.map((v,i)=>({v,i})).sort(()=>Math.random()-.5),el=document.getElementById('quizOpts');el.innerHTML='';for(let x of opts){let b=document.createElement('button');b.className='opt';b.textContent=x.v;b.onclick=()=>answer(b,x.i);el.appendChild(b)}}function answer(btn,i){if(locked)return;locked=true;let ok=i===0;score+=ok?10:-3;btn.classList.add(ok?'good':'bad');beep(ok);document.getElementById('quizFeedback').textContent=ok?'Tačno!':'Tačan odgovor: '+QA[qi].a;document.getElementById('quizScore').textContent='Bodovi: '+score;setTimeout(()=>{qi++;if(qi>=QA.length){document.getElementById('quizFeedback').textContent='Kviz završen! Osvojeni bodovi: '+score;document.getElementById('quizOpts').innerHTML='<button onclick="startQuiz()">Ponovi kviz</button>';return}drawQuiz()},1300)}function shuffled(a){return a.sort(()=>Math.random()-.5)}function startMatch(){show('match');matchDone=new Set();matchPick=null;let items=shuffled(CARD_QA.map((q,i)=>({i,t:q.q,kind:'q'})).concat(CARD_QA.map((q,i)=>({i,t:q.a,kind:'a'}))));let g=document.getElementById('matchGrid');g.innerHTML='';items.forEach(x=>{let b=document.createElement('button');b.className='tile';b.textContent=x.t;b.onclick=()=>{if(b.disabled)return;if(!matchPick){matchPick={...x,b};b.classList.add('selected')}else{let ok=matchPick.i===x.i&&matchPick.kind!==x.kind&&matchPick.b!==b;if(ok){b.classList.add('matched');matchPick.b.classList.add('matched');b.disabled=matchPick.b.disabled=true;matchDone.add(x.i);beep(true)}else{beep(false);matchPick.b.classList.remove('selected')}matchPick=null;document.getElementById('matchStatus').textContent='Spojeno: '+matchDone.size+' / '+CARD_QA.length}};g.appendChild(b)});document.getElementById('matchStatus').textContent='Spojeno: 0 / '+CARD_QA.length}function startMemory(){show('memory');memDone=new Set();memOpen=[];memLocked=false;let subset=CARD_QA.slice(0,5);let items=shuffled(subset.map((q,i)=>({i,t:q.q})).concat(subset.map((q,i)=>({i,t:q.a}))));let g=document.getElementById('memGrid');g.innerHTML='';items.forEach(x=>{let b=document.createElement('button');b.textContent='?';b.onclick=()=>{if(memLocked||b.classList.contains('done')||memOpen.some(z=>z.b===b))return;b.classList.add('open');b.textContent=x.t;memOpen.push({...x,b});if(memOpen.length===2){memLocked=true;let [a,c]=memOpen,ok=a.i===c.i;beep(ok);setTimeout(()=>{if(ok){a.b.classList.add('done');c.b.classList.add('done');memDone.add(a.i)}else{for(let z of memOpen){z.b.textContent='?';z.b.classList.remove('open')}}memOpen=[];memLocked=false;document.getElementById('memStatus').textContent='Parovi: '+memDone.size+' / 5'+(memDone.size===5?' • Bravo!':'')},850)}};g.appendChild(b)});document.getElementById('memStatus').textContent='Parovi: 0 / 5'}</script></body></html>
